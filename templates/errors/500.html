{% extends "layout.html" %} {% block title %}500 - Error del Servidor{% endblock
%} {% block content %}
<div class="error-page">
  <div class="error-content">
    <div class="error-icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 class="error-code">500</h1>
    <h2 class="error-title">Error del Servidor</h2>
    <p class="error-message">
      Ocurrió un error inesperado. Nuestro equipo ha sido notificado y está
      trabajando en solucionarlo.
    </p>
    <div class="error-actions">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="fas fa-home"></i> Ir al Dashboard
      </a>
      <button onclick="location.reload()" class="btn btn-secondary">
        <i class="fas fa-redo"></i> Reintentar
      </button>
    </div>
  </div>
</div>
{% endblock %}
